workflows:
  ios-unsigned-ipa:
    name: CurConv iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify Flutter and Dart toolchain
        script: |
          flutter --version
          dart --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Check Firebase iOS configuration
        script: |
          test -f ios/Runner/GoogleService-Info.plist
          test -f ios/Podfile

      - name: Sync and diagnose CocoaPods lockfiles
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          echo "Comparing Podfile.lock with Pods/Manifest.lock"
          diff -u Podfile.lock Pods/Manifest.lock || echo "NOTICE: CocoaPods lockfiles differ"
          cd ..

      - name: Build unsigned iOS app (Firebase SPM)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr CurConv-unsigned.ipa Payload

    artifacts:
      - build/ios/iphoneos/*.ipa
